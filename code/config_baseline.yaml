data_path: data/sow_features_minimal.csv
output_dir: results

cv:
  n_splits: 5
  shuffle: true
  random_state: 42

model:
  estimator: HistGradientBoostingRegressor
  params:
    max_iter: 500
    learning_rate: 0.05
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 0.0
    random_state: 42
